{
  "paths": {
    "train_root_dir": "/kaggle/input/datasets/huynhthethien/radarcommunsignaldata2026train",
    "output_dir": "output",
    "model_output_path": "output/TrainedModel.pt",
    "train_log_path": "output/train_log.csv"
  },
  "model": {
    "num_classes": 12
  },
  "data": {
    "val_split": 0.2,
    "split_random_state": 42,
    "batch_size_train": 64,
    "batch_size_val": 32,
    "num_workers": 4,
    "pin_memory": true,
    "drop_last_train": true,
    "drop_last_val": false,
    "time_mask_param": 15,
    "freq_mask_param": 20,
    "normalize_mean": [0.5, 0.5, 0.5],
    "normalize_std": [0.5, 0.5, 0.5]
  },
  "training": {
    "num_epochs": 80,
    "learning_rate": 0.0003,
    "weight_decay": 0.01,
    "label_smoothing": 0.1,
    "min_lr": 0.000001,
    "grad_clip_factor": 0.01
  },
  "visualization": {
    "save_dir": "output",
    "confusion_threshold": 3
  }
}
